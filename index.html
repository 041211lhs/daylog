<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAYLOG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>DAYLOG</h1>
  </header>

  <main id="app">
    <section id="calendar-view">
      <div class="calendar-header">
        <button id="prev-month-btn" class="nav-btn">‹</button>
        <h2 id="current-month-label"></h2>
        <button id="next-month-btn" class="nav-btn">›</button>
        <button id="today-btn" class="today-btn">오늘</button>
        <button id="add-event-btn" class="primary-btn">+ 일정 추가</button>
      </div>

      <div class="weekday-row">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>

      <div id="calendar-grid" class="calendar-grid"></div>
    </section>

    <section id="week-view" class="hidden">
      <div class="week-header">
        <button id="back-to-month-btn" class="nav-btn">← 월간</button>
        <button id="prev-week-btn" class="nav-btn">‹</button>
        <h2 id="current-week-label"></h2>
        <button id="next-week-btn" class="nav-btn">›</button>
      </div>

      <div id="week-grid" class="week-grid"></div>
    </section>
  </main>

  <!-- 일정 추가/수정 입력창 (평소에는 hidden 상태) -->
  <div id="event-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">일정 추가</h3>
      <label>날짜
        <input type="date" id="event-date" />
      </label>
      <label>시간 (선택)
        <input type="time" id="event-time" />
      </label>
      <label>제목
        <input type="text" id="event-title" maxlength="50" placeholder="예: 경제학 수업" />
      </label>
      <p id="modal-error" class="modal-error"></p>
      <div class="modal-actions">
        <button id="delete-event-btn" class="danger-btn hidden">삭제</button>
        <button id="cancel-event-btn" class="nav-btn">취소</button>
        <button id="save-event-btn" class="primary-btn">저장</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/week.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
