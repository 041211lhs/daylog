<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAYLOG</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <!-- 접속 시 잠깐 보였다 사라지는 스플래시 화면 -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <span class="splash-dot"></span>
      <span class="splash-text">DAYLOG</span>
    </div>
  </div>

  <header class="app-header">
    <div class="app-header-left">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>DAYLOG</h1>
      </div>
      <p class="brand-tagline">일정을 관리하고, 하루를 기록하는 캘린더</p>
    </div>

    <div class="view-tabs">
      <button class="view-tab-btn active" data-view="month" id="tab-month-btn">Month</button>
      <button class="view-tab-btn" data-view="week" id="tab-week-btn">Week</button>
      <button class="view-tab-btn" data-view="day" id="tab-day-btn">Day</button>
    </div>
  </header>

  <main id="app">
    <section id="calendar-view">
      <div class="panel-card">
        <div class="calendar-header">
          <div class="calendar-nav-group">
            <button id="prev-month-btn" class="icon-btn">‹</button>
            <h2 id="current-month-label"></h2>
            <button id="next-month-btn" class="icon-btn">›</button>
          </div>
          <div class="calendar-action-group">
            <button id="today-btn" class="today-btn">오늘</button>
            <button id="add-event-btn" class="primary-btn">+ 일정 추가</button>
          </div>
        </div>

        <div class="weekday-row">
          <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
    </section>

    <section id="week-view" class="hidden">
      <div class="panel-card">
        <div class="week-header">
          <button id="back-to-month-btn" class="icon-btn icon-btn--wide">← 월간</button>
          <div class="calendar-nav-group">
            <button id="prev-week-btn" class="icon-btn">‹</button>
            <h2 id="current-week-label"></h2>
            <button id="next-week-btn" class="icon-btn">›</button>
          </div>
        </div>

        <div id="week-grid" class="week-grid"></div>
      </div>
    </section>

    <section id="day-view" class="hidden">
      <div class="panel-card">
        <div class="day-header">
          <button id="back-to-week-btn" class="icon-btn icon-btn--wide">← 주간</button>
          <h2 id="current-day-label"></h2>
        </div>

        <div class="day-panels">
          <div class="day-panel day-panel--schedule">
            <div class="day-panel-head">
              <h3>오늘의 일정</h3>
              <button id="day-add-event-btn" class="ghost-btn small-btn">+ 추가</button>
            </div>
            <div id="day-event-list" class="day-event-list"></div>
          </div>

          <div class="day-panel day-panel--mood">
            <div class="day-panel-head">
              <h3>오늘의 기분</h3>
            </div>
            <div id="mood-options" class="mood-options"></div>
          </div>

          <div class="day-panel day-panel--journal">
            <div class="day-panel-head">
              <h3>오늘의 기록</h3>
            </div>
            <textarea id="journal-input" class="journal-input" rows="6" placeholder="오늘 하루는 어땠나요?"></textarea>
            <div class="journal-actions">
              <button id="save-journal-btn" class="ghost-btn small-btn">기록 저장</button>
              <span id="journal-saved-msg" class="journal-saved-msg"></span>
            </div>

            <div class="reflect-box">
              <button id="reflect-btn" class="primary-btn small-btn">✨ AI 하루 회고 요청</button>
              <p id="reflect-error" class="modal-error"></p>
              <div id="reflect-result" class="reflect-result hidden"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 일정 추가/수정 입력창 -->
  <div id="event-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">일정 추가</h3>
      <label>시작일
        <input type="date" id="event-date" />
      </label>
      <label>종료일 (선택 — 여러 날에 걸친 일정이면 입력)
        <input type="date" id="event-end-date" />
      </label>
      <label>시간 (선택)
        <input type="time" id="event-time" />
      </label>
      <label>제목
        <input type="text" id="event-title" maxlength="50" placeholder="예: 경제학 수업" />
      </label>
      <p id="modal-error" class="modal-error"></p>
      <div class="modal-actions">
        <button id="delete-event-btn" class="danger-btn hidden">삭제</button>
        <button id="cancel-event-btn" class="ghost-btn">취소</button>
        <button id="save-event-btn" class="primary-btn">저장</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/week.js"></script>
  <script src="js/day.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
